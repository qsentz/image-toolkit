<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Sales Monitoring Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#08090A;
    --bg-2:#0D0F0F;
    --surface:#131616;
    --surface-alt:#1B1F1F;
    --border:#2A2F2F;
    --border-soft:#1D2121;

    --text:#EDF1EC;
    --text-dim:#98A39A;
    --muted:#57625B;

    --gold:#FFB238;
    --gold-bg:rgba(255,178,56,.16);
    --stone:#7C8984;
    --stone-bg:rgba(124,137,132,.18);
    --slate:#34C6E8;
    --slate-bg:rgba(52,198,232,.16);
    --green:#33DD8C;
    --green-bg:rgba(51,221,140,.16);

    --accent:#C8FF4D;
    --accent-bright:#E1FFA0;
    --accent-bg:rgba(200,255,77,.16);
    --on-accent:#10160A;

    --radius:6px;
    --radius-sm:3px;
    --font-serif:'Bricolage Grotesque', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
    --font-sans:'IBM Plex Sans Thai', 'IBM Plex Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{height:100%; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    font-size:12px;
    position:relative;
    display:flex; flex-direction:column;
    overflow-x:hidden;
    overflow-x:clip;
  }
  ::-webkit-scrollbar{width:5px; height:5px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .topbar-wrap{position:sticky; top:0; z-index:20; flex:0 0 auto;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:10px 20px; background:var(--bg-2); border-bottom:1.5px solid var(--border);
    border-top:2px solid var(--accent);
  }
  .topbar-title-wrap{min-width:0;}
  .topbar-title{display:flex; align-items:center; gap:10px; min-width:0;}
  .topbar h1{
    font-family:var(--font-serif); font-size:19px; margin:0; font-weight:700; letter-spacing:.01em;
    text-transform:uppercase; cursor:default; user-select:none; color:var(--text);
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .live-chip{
    font-family:var(--font-mono); font-size:9px; font-weight:700; color:var(--on-accent);
    background:var(--accent); padding:2px 7px 1px; border-radius:2px; border:1px solid rgba(200,255,77,.5);
    display:inline-block; letter-spacing:.06em;
    box-shadow:0 0 6px rgba(200,255,77,.3);
    animation:liveGlow 2.4s ease-in-out infinite;
  }
  @keyframes liveGlow{
    0%,100%{box-shadow:0 0 6px rgba(200,255,77,.3);}
    50%{box-shadow:0 0 2px rgba(200,255,77,.12);}
  }
  .topbar .sub{font-size:10.5px; color:var(--muted); margin-top:2px;}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .btn{
    font-family:var(--font-mono); border:1.5px solid var(--border); background:var(--surface); color:var(--text);
    padding:5px 14px; border-radius:var(--radius-sm); font-size:10.5px; cursor:pointer; font-weight:600;
    letter-spacing:.04em;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--surface-alt); border-color:var(--text-dim);}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent-bright); border-color:var(--accent-bright);}
  .btn.hidden-cfg{display:none;}

  .btn-refresh{
    -webkit-appearance:none; appearance:none; forced-color-adjust:none;
    display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--accent);
    border-radius:999px; padding:6px 17px 6px 14px;
    background:var(--accent);
    color:var(--on-accent);
    transition:background-color .15s ease, border-color .15s ease, transform .16s ease;
  }
  .btn-refresh:hover{
    background:var(--accent-bright);
    border-color:var(--accent-bright); transform:translateY(-1.5px);
  }
  .btn-refresh:active{transform:translateY(0) scale(.96);}
  .btn-refresh-icon{width:13px; height:13px; flex:0 0 auto; transition:transform .5s ease;}
  .btn-refresh:hover .btn-refresh-icon{transform:rotate(180deg);}
  .btn-refresh.is-loading .btn-refresh-icon{animation:btnRefreshSpin .8s linear infinite;}
  @keyframes btnRefreshSpin{ to{ transform:rotate(360deg); } }

  .live-wrap{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-dim);}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;position:relative;}
  .status-dot.err{background:var(--accent);}
  .status-dot.loading{background:var(--gold);}
  .status-dot.ok::after{
    content:''; position:absolute; inset:-4px; border-radius:50%;
    border:1.5px solid var(--green); animation:pulseRing 1.8s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ transform:scale(.6); opacity:.7; }
    80%{ transform:scale(1.9); opacity:0; }
    100%{ opacity:0; }
  }
  #lastUpdated{display:flex; align-items:center; gap:6px;}

  .refresh-track{height:2px; background:var(--border-soft); overflow:hidden;}
  .refresh-bar{height:100%; width:0%; background:var(--accent);}

  .config{
    display:none; padding:12px 20px; background:var(--bg-2); border-bottom:1.5px solid var(--border);
    gap:12px; flex-wrap:wrap; align-items:flex-end;
  }
  .config.open{display:flex;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:10.5px; color:var(--muted); font-weight:700;}
  .field input{
    font-family:var(--font-sans);
    border:1.5px solid var(--border); border-radius:4px; padding:6px 10px; font-size:12px; min-width:240px;
    background:var(--surface); color:var(--text);
  }
  .config .note{font-size:10.5px; color:var(--muted); max-width:520px; line-height:1.5;}
  .config .note code{background:var(--surface-alt); color:var(--text-dim); padding:1px 5px; border-radius:3px;}

  .wrap{
    flex:1 1 auto; max-width:1600px; width:100%; margin:0 auto; padding:8px 14px 14px;
    display:flex; flex-direction:column; gap:8px; min-height:0;
  }
  #banner{display:none; padding:8px 12px; border-radius:4px; background:var(--accent-bg); border:1px solid var(--accent); color:#EAFFC2; font-size:11.5px; line-height:1.4;}
  #banner.show{display:block;}
  #banner code{background:var(--surface-alt); padding:1px 5px; border-radius:3px;}

  #dashboard{display:flex; flex-direction:column; gap:8px;}

  .dash-section{
    position:relative; display:flex; flex-direction:column; gap:8px;
    padding:20px 4px 4px; border:1px solid var(--border-soft); border-radius:4px;
  }
  .dash-content{
    position:relative; display:flex; flex-direction:column; gap:8px;
  }
  .section-label{
    position:absolute; top:-9px; left:14px; background:var(--bg-2); color:var(--accent-bright);
    font-family:var(--font-serif); font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    padding:1px 8px; border:1px solid var(--border-soft); border-radius:2px;
  }
  .fs-btn{
    position:absolute; top:8px; right:8px; z-index:6;
    width:26px; height:26px; border-radius:var(--radius-sm); padding:0;
    border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim);
    font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  .fs-btn:hover{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
  .fs-btn:active{transform:scale(.93);}
  #trackingSection .fs-btn{ top:8px; right:8px; }
  .dash-section.is-fullscreen{
    position:fixed; inset:0; z-index:600; margin:0; border-radius:0;
    background:var(--bg); overflow:auto; padding:44px 18px 24px;
    animation:fadeInUp .18s ease both;
  }
  .dash-section.is-fullscreen .section-label{top:12px; left:16px;}
  .dash-section.is-fullscreen .fs-btn{top:12px; right:14px;}
  body.body-fs-lock{overflow:hidden;}
  body.body-fs-lock .topbar-wrap{visibility:hidden;}

  #trackingSection.is-fullscreen{overflow:hidden;}
  #trackingSection.is-fullscreen .dash-content{flex:1 1 auto; min-height:0;}
  #trackingSection.is-fullscreen .card{flex:1 1 auto; min-height:0;}
  #trackingSection.is-fullscreen .track-table-scroll{flex:1 1 auto; max-height:none;}

  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .card{
    position:relative; min-width:0;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    border-top:1px solid var(--border); border-left:2px solid var(--border-soft);
    padding:9px 11px;
    display:flex; flex-direction:column;
    transition:border-color .18s ease, transform .18s ease;
  }
  .card:hover{border-left-color:var(--accent); border-color:var(--text-dim); transform:translateY(-1px);}
  .card h2{
    font-family:var(--font-serif); font-size:12.5px; margin:0 0 7px; font-weight:700; color:var(--text);
    text-transform:uppercase; letter-spacing:.05em;
    display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap;
    padding-bottom:6px; border-bottom:1px solid var(--border-soft);
  }
  .card h2 .tag{
    font-family:var(--font-sans); font-size:9.5px; color:var(--muted); font-weight:600; letter-spacing:0;
    background:var(--bg-2); padding:1px 7px; border-radius:3px; display:inline-block;
    border:1px solid var(--border-soft);
  }
  .h2-title{display:inline-flex; align-items:center; gap:6px;}
  .h2-icon{width:14px; height:14px; flex:0 0 auto; color:var(--accent);}
  .card-body{min-height:0;}
  .soft{transition:opacity .28s ease;}

  @media(max-width:600px){
    .wrap{padding:10px 10px 20px;}
    .topbar{padding:10px 12px; flex-wrap:wrap; row-gap:8px;}
    .topbar-title-wrap{width:100%; order:1;}
    .topbar h1{font-size:14px; white-space:normal; overflow:visible; text-overflow:clip; line-height:1.3;}
    .topbar-right{order:2; width:100%; justify-content:space-between; flex-wrap:wrap; row-gap:6px;}
  }

  @property --gx1{ syntax:'<percentage>'; inherits:false; initial-value:96%; }
  @property --gy1{ syntax:'<percentage>'; inherits:false; initial-value:-20%; }
  @property --gx2{ syntax:'<percentage>'; inherits:false; initial-value:5%; }
  @property --gy2{ syntax:'<percentage>'; inherits:false; initial-value:85%; }

  .hero{
    position:relative;
    --gx1:96%; --gy1:-20%; --gx2:5%; --gy2:85%;
    background:
      radial-gradient(600px 600px at var(--gx1) var(--gy1), rgba(225,255,160,.22) 0%, rgba(200,255,77,.13) 36%, transparent 68%),
      radial-gradient(460px 460px at var(--gx2) var(--gy2), rgba(200,255,77,.15) 0%, rgba(200,255,77,.07) 40%, transparent 70%),
      var(--surface);
    background-repeat:no-repeat, no-repeat, no-repeat;
    border:1px solid var(--border); border-top:3px solid var(--accent); border-radius:var(--radius);
    padding:14px 24px 14px;
    display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center;
    animation:fadeInUp .4s ease both, heroGlowDrift 26s ease-in-out infinite;
  }
  @keyframes heroGlowDrift{
    0%   { --gx1:96%; --gy1:-20%; --gx2:5%;  --gy2:85%;  }
    20%  { --gx1:68%; --gy1:8%;   --gx2:35%; --gy2:58%;  }
    40%  { --gx1:28%; --gy1:38%;  --gx2:66%; --gy2:28%;  }
    60%  { --gx1:8%;  --gy1:74%;  --gx2:90%; --gy2:4%;   }
    80%  { --gx1:44%; --gy1:96%;  --gx2:58%; --gy2:-12%; }
    100% { --gx1:96%; --gy1:-20%; --gx2:5%;  --gy2:85%;  }
  }
  @media(prefers-reduced-motion:reduce){
    .hero{animation:fadeInUp .4s ease both;}
  }
  .hero-sticker{
    position:absolute; top:-11px; left:20px; background:var(--accent); color:var(--on-accent);
    font-family:var(--font-mono); font-size:10px; font-weight:700; padding:3px 11px 2px; border-radius:2px;
    border:1px solid rgba(0,0,0,.3); letter-spacing:.08em;
  }
  .hero-left{display:flex; align-items:center; gap:26px;}
  .hero-ring{position:relative; width:64px; height:64px; flex:0 0 auto;}
  .hero-ring canvas{width:64px; height:64px; display:block;}
  .hero-ring.hero-ring-lg{width:150px; height:150px;}
  .hero-ring.hero-ring-lg canvas{width:150px; height:150px;}
  .hero-nums .big{font-family:var(--font-serif); font-size:88px; font-weight:800; line-height:1; color:var(--text); letter-spacing:-.02em;}
  .hero-nums .lbl{font-family:var(--font-mono); font-size:12.5px; color:var(--accent-bright); margin-top:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;}
  .hero-nums .of-total{font-size:12.5px; color:var(--muted); margin-top:8px;}
  .hero-right{border-left:1px solid var(--border); padding-left:24px; position:relative; z-index:1;}
  .hero-substats{display:grid; grid-template-columns:1fr 1fr; gap:18px; height:100%; align-items:center;}
  .hero-substat{min-width:0;}
  .hero-substat .lbl{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .hero-substat .lbl .dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .hero-substat .val{font-family:var(--font-serif); font-size:52px; font-weight:800; line-height:1; letter-spacing:-.01em; color:var(--text);}
  .hero-substat .val .pct{font-family:var(--font-mono); font-size:15px; font-weight:700; color:var(--muted); margin-left:8px;}
  .hero-substat .sub{font-size:11.5px; color:var(--muted); margin-top:8px;}
  .hero-substat .sub b{color:var(--text-dim); font-weight:700;}
  @media(max-width:520px){
    .hero-substats{grid-template-columns:1fr; gap:12px;}
    .hero-substat .val{font-size:38px;}
  }
  .hero-substat-hoverable{cursor:help; border-radius:6px; padding:4px 6px; margin:-4px -6px; transition:background .15s ease;}
  .hero-substat-hoverable:hover, .hero-substat-hoverable:focus-visible{background:rgba(56,189,242,.08); outline:none;}

  .omni-ship-tip{
    position:fixed; z-index:1100; display:none; width:280px; max-width:calc(100vw - 20px);
    background:var(--surface); border:1px solid var(--border); border-top:2px solid var(--accent);
    border-radius:6px; padding:10px 12px 12px;
    pointer-events:none;
  }
  .omni-ship-tip.show{display:block; animation:fadeInUp .14s ease both;}
  .omni-ship-tip .rank-subcard-head{margin-bottom:8px;}
  .omni-ship-tip #omniShipTipBody{max-height:220px; overflow-y:auto;}
  .tiles{display:flex; flex-wrap:wrap; gap:8px;}
  .tile{border-radius:var(--radius-sm); padding:6px 5px; text-align:center; border:1px solid var(--border-soft); transition:transform .12s ease, border-color .12s ease; flex:1 1 110px;}
  .tile:hover{transform:translateY(-1px); border-color:var(--text-dim);}
  .tile .n{font-family:var(--font-serif); font-size:22px; font-weight:800;}
  .tile .p{font-size:11px; opacity:.85;}
  .tile .l{font-size:10px; margin-top:3px; opacity:.85; word-break:break-word; letter-spacing:.03em;}

  @media(max-width:760px){
    .hero{grid-template-columns:1fr;}
    .hero-right{border-left:none; padding-left:0; border-top:1px solid var(--border); padding-top:10px;}
  }

  .hero-row{display:grid; grid-template-columns:1fr; gap:12px; align-items:stretch;}
  @media(min-width:900px){ .hero-row{grid-template-columns:72% 1fr;} }
  .hero-row.no-compare{grid-template-columns:1fr;}
  .compare-card-narrow{display:flex; flex-direction:column;}
  .compare-chart-wrap{height:auto; flex:1 1 auto; min-height:130px;}

  .grid-70-30{display:grid; grid-template-columns:1fr; gap:12px; align-items:stretch;}
  @media(min-width:900px){ .grid-70-30{grid-template-columns:72% 1fr;} }
  .col-70, .col-30{display:flex; flex-direction:column; min-width:0;}
  .col-70 .card, .col-30 .card{flex:1 1 auto;}

  .grid-asym{display:grid; grid-template-columns:1fr; gap:12px; align-items:stretch;}
  @media(min-width:900px){ .grid-asym{grid-template-columns:34% 1fr;} }
  .col-narrow, .col-wide{display:flex; flex-direction:column; gap:12px; min-width:0; min-height:0;}
  @media(min-width:900px){ .col-wide > .card{flex:1 1 0; min-height:0;} }
  .col-narrow > .card{flex:1 1 auto;}

  .grid-duo-equal{display:grid; grid-template-columns:1fr; gap:12px; align-items:stretch;}
  @media(min-width:900px){ .grid-duo-equal{grid-template-columns:1.15fr .85fr;} }

  .grp-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-soft);}
  .grp-row:last-child{border-bottom:none;}
  .grp-name{display:flex; align-items:center; gap:6px; font-weight:700; font-size:11px;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .grp-nums{text-align:right;}
  .grp-nums .n{font-family:var(--font-serif); font-size:17px; font-weight:800;}
  .grp-nums .p{font-size:9.5px; color:var(--muted);}
  .pre-badge{font-size:9px; color:var(--muted); margin-top:2px;}
  .pre-badge b{color:var(--text-dim); font-weight:700;}

  .grp-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:2px;}
  .grp-grid .grp-row{
    display:flex; flex-direction:column; align-items:flex-start; gap:3px;
    border:1px solid var(--border); border-bottom:1px solid var(--border); border-radius:4px;
    background:var(--surface); padding:8px 9px; min-width:0;
  }
  .grp-grid .grp-nums{text-align:left; width:100%;}
  @media(max-width:480px){ .grp-grid{grid-template-columns:1fr;} }

  .split-bar{display:flex; width:100%; height:16px; border-radius:4px; overflow:hidden; background:var(--border-soft); margin-bottom:4px;}
  .split-seg{height:100%; min-width:2px; transition:width .5s ease;}

  #cardOmni .rank-subcards{flex:1 1 auto; min-height:0;}
  #cardOmni .rank-subcard{display:flex; flex-direction:column; min-height:0;}
  #cardOmni .rank-subcards .tiles{flex:1 1 auto; min-height:0; align-content:center;}

  .bar-row{margin-bottom:8px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row .top{display:flex; justify-content:space-between; font-size:10.5px; margin-bottom:3px; gap:6px;}
  .bar-row .top .name{font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-row .top .val{color:var(--muted); flex:0 0 auto; font-weight:700;}
  .bar-track{background:var(--border-soft); border-radius:3px; height:5px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:3px; transition:width .6s ease;}

  .tier-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(85px,1fr)); gap:6px;}
  .tier-box{border-radius:4px; padding:6px 4px; text-align:center; border:1px solid var(--border-soft); transition:transform .12s ease, border-color .12s ease;}
  .tier-box:hover{transform:translateY(-1px); border-color:var(--text-dim);}
  .tier-box .n{font-family:var(--font-serif); font-size:16px; font-weight:800;}
  .tier-box .l{font-size:9.5px; margin-top:2px; font-weight:600;}
  .tier-box .p{font-size:9px; opacity:.85;}

  .menu-sub{font-size:9px; color:var(--muted); margin-top:3px; display:flex; gap:14px;}
  .menu-sub b{color:var(--gold); font-weight:700;}
  .menu-sub .menu-sub-col{display:flex; flex-direction:column;}
  .menu-sub .menu-sub-col .pct{margin-top:1px;}

  .stock-donut-wrap{display:flex; align-items:center; gap:16px; flex:1 1 auto; min-height:0;}
  .chart-wrap.donut{position:relative; flex:0 0 auto; width:min(170px, 42%); aspect-ratio:1 / 1; height:auto;}
  .chart-wrap.donut canvas{width:100% !important; height:100% !important; display:block;}
  .stock-legend{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:7px; justify-content:center;}
  .legend-row{display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:10.5px;}
  .legend-row .lg-name{display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden;}
  .legend-row .lg-dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}

const decryptCache = new Map();

function base64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToHex(bytes){
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, '0');
  return s;
}
function getHmacKey_(secretKey){
  if (hmacKeyCache && hmacKeyCache.secretKey === secretKey) return hmacKeyCache.cryptoKeyPromise;
  const p = crypto.subtle.importKey('raw', new TextEncoder().encode(secretKey), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  hmacKeyCache = { secretKey, cryptoKeyPromise: p };
  return p;
}
async function hmacSha256Bytes_(secretKey, message){
  const key = await getHmacKey_(secretKey);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(message));
  return new Uint8Array(sig);
}
async function generateKeystream_(secretKey, ivHex, length){
  const keystream = new Uint8Array(length);
  let filled = 0, counter = 0;
  while (filled < length){
    const block = await hmacSha256Bytes_(secretKey, ivHex + '|' + counter);
    for (let i = 0; i < block.length && filled < length; i++, filled++) keystream[filled] = block[i];
    counter++;
  }
  return keystream;
}
async function decryptText_(cipherB64, secretKey){
  if (!cipherB64) return '';
  const combined = base64ToBytes(cipherB64);
  if (combined.length <= 8) return '';
  const ivBytes = combined.slice(0, 8);
  const cipherBytes = combined.slice(8);
  const ivHex = bytesToHex(ivBytes);
  const keystream = await generateKeystream_(secretKey, ivHex, cipherBytes.length);
  const plainBytes = new Uint8Array(cipherBytes.length);
  for (let i = 0; i < cipherBytes.length; i++) plainBytes[i] = cipherBytes[i] ^ keystream[i];
  return new TextDecoder('utf-8').decode(plainBytes);
}
function decryptCached(cipherB64, secretKey){
  if (!cipherB64 || !secretKey) return Promise.resolve('');
  const cacheKey = secretKey + '::' + cipherB64;
  if (!decryptCache.has(cacheKey)){
    decryptCache.set(cacheKey, decryptText_(cipherB64, secretKey).catch(() => '__DECRYPT_FAILED__'));
  }
  return decryptCache.get(cacheKey);
}
function clearDecryptCache(){ decryptCache.clear(); hmacKeyCache = null; }

async function fetchSheet(sheetId, sheetName){

  const res = await fetch(url);
  const text = await res.text();
  const m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
  if (!m) {
    throw new Error('อ่านข้อมูลจาก COLLECTION ไม่สำเร็จ (ตรวจสอบว่า DATA ID / ชื่อ COLLECTION)');
  }
  const json = JSON.parse(m[1]);
  if (json.status === 'error') {
    const detail = (json.errors && json.errors[0] && json.errors[0].detailed_message) || 'unknown error';
    throw new Error('COLLECTION ส่ง ERROR กลับมา: ' + detail);
  }
  const cols = json.table.cols.map(c => (c.label || c.id || '').trim());
  const rows = json.table.rows.map(r => (r.c || []).map(cell => cell ? cell.v : null));
  return { cols, rows };
}

    return new Date(p[0], p[1], p[2] || 1, p[3] || 0, p[4] || 0, p[5] || 0);
  }
  if (v instanceof Date) return v;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function filterToLatestDate(rows){
  let latestKey = -Infinity;
  rows.forEach(r => {
    if (!r.ts) return;
    const key = new Date(r.ts.getFullYear(), r.ts.getMonth(), r.ts.getDate()).getTime();
    if (key > latestKey) latestKey = key;
  });
  if (latestKey === -Infinity) return rows;
  return rows.filter(r => {
    if (!r.ts) return false;
    const key = new Date(r.ts.getFullYear(), r.ts.getMonth(), r.ts.getDate()).getTime();
    return key === latestKey;
  });
}

const isBlank = v => !v || v === '-';
const grp = ot => /AIS/i.test(ot) ? 'AIS' : 'PARTNER';
function decodeObjectIdMs(oid){
  if (!oid || oid.length < 8) return null;
  const hex8 = oid.substring(0, 8);
  if (!/^[0-9a-fA-F]{8}$/.test(hex8)) return null;
  return parseInt(hex8, 16) * 1000;
}
function topN(rows, field, n){
  const m = {};
  rows.forEach(r => { const k = r[field]; m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).map(([name,count]) => ({name,count})).sort((a,b)=>b.count-a.count).slice(0, n);
}
function fmtPct(p){ return (Math.round(p*10)/10).toFixed(1) + '%'; }

function distributePct(counts, total){
  if (!total) return counts.map(() => 0);
  const raw = counts.map(c => (c / total) * 1000);
  const floors = raw.map(Math.floor);
  const used = floors.reduce((a,b) => a+b, 0);
  const target = Math.round(raw.reduce((a,b) => a+b, 0));
  const remainder = Math.max(0, Math.min(counts.length, target - used));
  const order = raw.map((v,i) => ({i, frac: v - floors[i]})).sort((a,b) => b.frac - a.frac);
  for (let k = 0; k < remainder; k++) floors[order[k].i]++;
  return floors.map(v => v / 10);
}
function fmtNum(n){ return n.toLocaleString('en-US'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function bucketDate(d, mode){
  if (mode === 'min10') return new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), Math.floor(d.getMinutes()/10)*10);
  if (mode === 'month') return new Date(d.getFullYear(), d.getMonth(), 1);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function hourLabel(d, mode){
  const pad = n => String(n).padStart(2,'0');
  if (mode === 'min10') return pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (mode === 'month') return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  return pad(d.getDate()) + '/' + pad(d.getMonth()+1);
}
function dayKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function computeDayCounts(rows){
  const dayCounts = {};
  rows.forEach(r => {
    if (r.state !== 'COMPLETE' || !r.ts) return;
    const k = dayKey(r.ts);
    dayCounts[k] = (dayCounts[k] || 0) + 1;
  });
  return dayCounts;
}

function softUpdate(el, html){

function animateNumber(el, to){
  if (!el) return;
  const from = parseInt((el.textContent || '0').replace(/,/g,''), 10) || 0;
  if (!dashboardBuilt || from === to){ el.textContent = fmtNum(to); return; }
  const dur = 500, start = performance.now();
  function step(t){
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtNum(Math.round(from + (to - from) * eased));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function drawRing(canvasEl, pct, color, size){
  if (!canvasEl || !canvasEl.getContext) return;
  size = size || 64;
  const ctx = canvasEl.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvasEl.width = size * dpr; canvasEl.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const lineWidth = size >= 90 ? 9 : 6;
  const fontSize = size >= 90 ? 16 : 10;
  const cx = size/2, cy = size/2, r = size/2 - lineWidth;
  const target = Math.max(0, Math.min(100, pct));
  const from = canvasEl.dataset.pct ? parseFloat(canvasEl.dataset.pct) : 0;
  canvasEl.dataset.pct = target;

  const token = (canvasEl._ringToken = (canvasEl._ringToken || 0) + 1);

  function paint(cur, glow){
    ctx.clearRect(0, 0, size, size);
    ctx.lineWidth = lineWidth; ctx.lineCap = 'round';
    ctx.strokeStyle = '#2A2F2F';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();

    const endAngle = -Math.PI/2 + (cur/100)*Math.PI*2;
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI/2, endAngle);
    ctx.stroke();
    ctx.restore();

    if (cur > 0.5){
      const tipX = cx + r * Math.cos(endAngle);
      const tipY = cy + r * Math.sin(endAngle);
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = glow * 1.5;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(tipX, tipY, lineWidth/2 + 1, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = '#EDF1EC';
    ctx.font = `700 ${fontSize}px "Sora",-apple-system,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(cur.toFixed(1) + '%', cx, cy);
  }

  function idleGlow(t0){
    function pulse(t){
      if (canvasEl._ringToken !== token) return;
      const phase = (t - t0) / 1000;
      const glow = 8 + Math.sin(phase * 1.6) * 4;
      paint(target, glow);
      requestAnimationFrame(pulse);
    }
    requestAnimationFrame(pulse);
  }

  const dur = 650, start = performance.now();
  function frame(t){
    if (canvasEl._ringToken !== token) return;
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    const cur = from + (target - from) * eased;
    const glow = 4 + eased * 10;
    paint(cur, glow);
    if (p < 1){
      requestAnimationFrame(frame);
    } else {
      idleGlow(t);
    }
  }
  requestAnimationFrame(frame);
}

function computeMetrics(rows){
  const stateRows = rows.filter(r => r.state);
  const grandTotal = stateRows.length;
  const stateCounts = {}; STATES.forEach(s => stateCounts[s] = 0);
  stateRows.forEach(r => { if (stateCounts[r.state] === undefined) stateCounts[r.state] = 0; stateCounts[r.state]++; });
  const completeCount = stateCounts.COMPLETE || 0;
  const otherStates = STATES.filter(s => s !== 'COMPLETE');
  const statusPctAll = distributePct([completeCount, ...otherStates.map(s => stateCounts[s]||0)], grandTotal);
  const completePct = statusPctAll[0];
  const statusTiles = otherStates.map((s, idx) => ({
    state: s, count: stateCounts[s] || 0, pct: statusPctAll[idx+1]
  }));

  const completeRows = rows.filter(r => r.state === 'COMPLETE');
  const prebookRows = completeRows.filter(r => !isBlank(r.preBookingNo));

  const otRows = completeRows.filter(r => r.orderType);
  const otCounts = {AIS:0, PARTNER:0};
  otRows.forEach(r => otCounts[grp(r.orderType)]++);
  const otTotal = otCounts.AIS + otCounts.PARTNER;
  const prebookByGrp = {AIS:0, PARTNER:0};
  prebookRows.forEach(r => { if (r.orderType) prebookByGrp[grp(r.orderType)]++; });
  const prebookTotal = prebookRows.length;
  const nonPrebookByGrp = {
    AIS: otCounts.AIS - prebookByGrp.AIS,
    PARTNER: otCounts.PARTNER - prebookByGrp.PARTNER
  };
  const [otPctAIS, otPctPartner] = distributePct([otCounts.AIS, otCounts.PARTNER], otTotal);
  const otPct = {AIS: otPctAIS, PARTNER: otPctPartner};
  const [prePctAIS, nonPrePctAIS] = distributePct([prebookByGrp.AIS, nonPrebookByGrp.AIS], otTotal);
  const [prePctPartner, nonPrePctPartner] = distributePct([prebookByGrp.PARTNER, nonPrebookByGrp.PARTNER], otTotal);
  const prebookPctByGrp = {AIS: prePctAIS, PARTNER: prePctPartner};
  const nonPrebookPctByGrp = {AIS: nonPrePctAIS, PARTNER: nonPrePctPartner};

  const nonPrebookTotal = completeCount - prebookTotal;
  const [prebookPctOfComplete, nonPrebookPctOfComplete] = distributePct([prebookTotal, nonPrebookTotal], completeCount);

  const stockRows = completeRows.filter(r => !isBlank(r.subStockDestination));
  const stockMap = {};
  stockRows.forEach(r => stockMap[r.subStockDestination] = (stockMap[r.subStockDestination]||0)+1);
  let stockArr = Object.entries(stockMap).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  if (stockArr.length > 4){
    const top4 = stockArr.slice(0,4);
    const other = stockArr.slice(4).reduce((s,x)=>s+x.count,0);
    stockArr = [...top4, {name:'OTHER', count: other}];
  }
  const stockTotal = stockRows.length;
  const stockPctArr = distributePct(stockArr.map(s => s.count), stockTotal);
  stockArr = stockArr.map((s,i) => ({...s, pct: stockPctArr[i]}));

  const omniRows = completeRows.filter(r => !isBlank(r.resOrderNo));
  const omniTotal = omniRows.length;
  const nonOmniTotal = completeCount - omniTotal;
  const [omniPctOfComplete, nonOmniPctOfComplete] = distributePct([omniTotal, nonOmniTotal], completeCount);
  const shipMap = {};
  omniRows.forEach(r => {
    const label = [r.resShippingType, r.resShippingSLA].filter(x => !isBlank(x)).join(' - ') || 'ไม่ระบุ';
    shipMap[label] = (shipMap[label] || 0) + 1;
  });
  let shipArr = Object.entries(shipMap).map(([name,count]) => ({name,count})).sort((a,b) => b.count - a.count);
  const shipTotal = omniTotal;
  const shipPctArr = distributePct(shipArr.map(s => s.count), shipTotal);
  shipArr = shipArr.map((s,i) => ({...s, pct: shipPctArr[i]}));

  const menuCounts = {};
  completeRows.forEach(r => { const m = r.menu || 'Unknown'; menuCounts[m] = (menuCounts[m]||0)+1; });
  const menuPrebook = {};
  prebookRows.forEach(r => { const m = r.menu || 'Unknown'; menuPrebook[m] = (menuPrebook[m]||0)+1; });
  const menuArr = Object.entries(menuCounts).map(([menu,orderCount]) => {
    const prebookCount = menuPrebook[menu] || 0;
    const nonPrebookCount = orderCount - prebookCount;
    const [prebookPct, nonPrebookPct] = distributePct([prebookCount, nonPrebookCount], orderCount);
    return { menu, orderCount, prebookCount, nonPrebookCount, prebookPct, nonPrebookPct };
  }).sort((a,b) => b.orderCount - a.orderCount);

  const productTypeCounts = {};
  completeRows.forEach(r => { const p = r.productType || 'Unknown'; productTypeCounts[p] = (productTypeCounts[p]||0)+1; });
  let productTypeArr = Object.entries(productTypeCounts).map(([name,count]) => ({name,count})).sort((a,b) => b.count - a.count);
  const productTypeTotal = completeCount;
  const productTypePctArr = distributePct(productTypeArr.map(p => p.count), productTypeTotal);
  productTypeArr = productTypeArr.map((p,i) => ({...p, pct: productTypePctArr[i]}));
  const productTypeItems = productTypeArr.length;


  const tsRows = completeRows.filter(r => r.ts);
  let mode = 'min10', buckets = [];
  if (tsRows.length){
    const times = tsRows.map(r => r.ts.getTime());
    const rangeHours = (Math.max(...times) - Math.min(...times)) / 3600000;
    mode = rangeHours <= 24 ? 'min10' : (rangeHours > 24*30 ? 'month' : 'day');
    const volMap = {};
    tsRows.forEach(r => {
      const b = bucketDate(r.ts, mode);
      const key = b.getTime();
      volMap[key] = volMap[key] || {date: b, AIS: 0, PARTNER: 0};
      volMap[key][grp(r.orderType || '')]++;
    });
    buckets = Object.values(volMap).sort((a,b) => a.date - b.date);
  }
  const volTotal = tsRows.length;

  const dayCounts = {};
  tsRows.forEach(r => {
    const k = dayKey(r.ts);
    dayCounts[k] = (dayCounts[k] || 0) + 1;
  });

  const durRows = [];
  completeRows.forEach(r => {
    if (!r.ts) return;
    const createdMs = decodeObjectIdMs(r.orderId);
    if (createdMs == null) return;
    const durationMs = r.ts.getTime() - createdMs;
    if (durationMs < 0) return;
    const durationMin = durationMs / 60000;
    const tier = durationMs < 600000 ? 'green' : (durationMs < 1800000 ? 'yellow' : 'red');
    durRows.push({...r, durationMs, durationMin, tier});
  });
  const durTotal = durRows.length;
  const tierCounts = {green:0, yellow:0, red:0};
  durRows.forEach(r => tierCounts[r.tier]++);
  const [greenPct, yellowPct, redPct] = distributePct([tierCounts.green, tierCounts.yellow, tierCounts.red], durTotal);
  const tierPct = {green: greenPct, yellow: yellowPct, red: redPct};
  const byOT = {};
  durRows.forEach(r => { if (!r.orderType) return; (byOT[r.orderType] = byOT[r.orderType] || []).push(r.durationMin); });
  const otDur = Object.entries(byOT).map(([orderType, arr]) => {
    const sorted = [...arr].sort((a,b)=>a-b);
    const avg = arr.reduce((s,x)=>s+x,0) / arr.length;
    const p90idx = Math.min(Math.ceil(0.9*sorted.length)-1, sorted.length-1);
    return { orderType, avg, p90: sorted[p90idx], cnt: arr.length };
  }).sort((a,b) => b.cnt - a.cnt).slice(0, 8);

  const slowest = durRows.filter(r => r.tier === 'red')
    .sort((a,b) => b.durationMs - a.durationMs).slice(0, 30)
    .map(r => ({
      id: r.transactionId || r.orderId,
      orderType: r.orderType || '-',
      durLabel: r.durationMin >= 60
        ? Math.floor(r.durationMin/60) + 'h ' + Math.floor(r.durationMin%60) + 'm'
        : Math.floor(r.durationMin) + 'm'
    }));

  let durBuckets = [];
  if (durRows.length){
    const dMap = {};
    durRows.forEach(r => {
      const b = bucketDate(r.ts, mode);
      const key = b.getTime();
      dMap[key] = dMap[key] || {date: b, sum: 0, n: 0};
      dMap[key].sum += r.durationMin; dMap[key].n++;
    });
    durBuckets = Object.values(dMap).sort((a,b) => a.date - b.date)
      .map(x => ({date: x.date, avg: x.sum / x.n}));
  }

  const validName = n => n && n !== '-' && n !== 'Invalid' && n.length < 100;
  const isDeviceType = r => (r.productType || '').trim().toUpperCase() === 'DEVICE';
  const devRows = completeRows.filter(r => isDeviceType(r) && validName(r.commercialName));
  const accRows = completeRows.filter(r => !isDeviceType(r) && validName(r.commercialName));
  const deviceTop = topN(devRows, 'commercialName', 30);
  const accessoryTop = topN(accRows, 'commercialName', 30);
  const deviceItems = new Set(devRows.map(r => r.commercialName)).size;
  const accessoryItems = new Set(accRows.map(r => r.commercialName)).size;
  const deviceOrders = devRows.length;
  const accessoryOrders = accRows.length;

  const campRows = completeRows.filter(r => !isBlank(r.campaignName));
  const svcRows = completeRows.filter(r => !isBlank(r.serviceCareTitle));
  const campTop = topN(campRows, 'campaignName', 30);
  const svcTop = topN(svcRows, 'serviceCareTitle', 30);
  const campItems = new Set(campRows.map(r => r.campaignName)).size;
  const svcItems = new Set(svcRows.map(r => r.serviceCareTitle)).size;
  const campOrders = campRows.length;
  const svcOrders = svcRows.length;

  const locRows = completeRows.filter(r => !isBlank(r.locationSource));
  const locMap = {};
  locRows.forEach(r => {
    const a = locMap[r.locationSource] || (locMap[r.locationSource] = {count:0});
    a.count++;
  });
  const locTop = Object.entries(locMap).map(([code,v]) => {
    return { code, name: locationDisplayName(code), count: v.count };
  }).sort((a,b) => b.count - a.count).slice(0, 15);
  const locTotal = locRows.length;
  const locItems = Object.keys(locMap).length;

  const buildImgMap = rowsSrc => {
    const m = {};
    rowsSrc.forEach(r => { if (!m[r.commercialName] && !isBlank(r.imageUrl)) m[r.commercialName] = r.imageUrl; });
    return m;
  };
  const deviceImgMap = buildImgMap(devRows);
  const accessoryImgMap = buildImgMap(accRows);

  const trackGrandTotal = rows.filter(r => r.orderId).length;
  const trackAll = rows.filter(r => r.orderId)
    .slice()
    .sort((a,b) => (b.ts ? b.ts.getTime() : 0) - (a.ts ? a.ts.getTime() : 0))
    .map(r => {
      const createdMs = decodeObjectIdMs(r.orderId);
      const durationMs = (r.ts && createdMs != null) ? (r.ts.getTime() - createdMs) : null;
      return { ...r, createdMs, durationMs: (durationMs != null && durationMs >= 0) ? durationMs : null };
    });
  const trackTotal = trackAll.length;

  return {
    grandTotal, completeCount, completePct, statusTiles,
    otCounts, otTotal, otPct, prebookByGrp, prebookTotal, nonPrebookByGrp,
    prebookPctByGrp, nonPrebookPctByGrp, nonPrebookTotal, prebookPctOfComplete, nonPrebookPctOfComplete,
    stockArr, stockTotal,
    omniTotal, nonOmniTotal, omniPctOfComplete, nonOmniPctOfComplete, shipArr, shipTotal,
    menuArr,
    productTypeArr, productTypeItems,
    mode, buckets, volTotal, dayCounts,
    durTotal, tierCounts, tierPct, otDur, slowest, durBuckets,
    deviceTop, accessoryTop, deviceItems, accessoryItems, deviceOrders, accessoryOrders,
    campTop, svcTop, campItems, svcItems, campOrders, svcOrders,
    locTop, locTotal, locItems,
    deviceImgMap, accessoryImgMap,
    trackAll, trackTotal, trackGrandTotal
  };
}

function toggleFullscreen(sectionId){
  const el = document.getElementById(sectionId);
  if (!el) return;
  const entering = !el.classList.contains('is-fullscreen');

  document.querySelectorAll('.dash-section.is-fullscreen').forEach(other => {
    if (other !== el){
      other.classList.remove('is-fullscreen');
      const otherBtn = other.querySelector('.fs-btn');
      if (otherBtn){ otherBtn.innerHTML = '⛶'; otherBtn.title = 'ขยายเต็มจอ'; }
    }
  });

  el.classList.toggle('is-fullscreen', entering);
  document.body.classList.toggle('body-fs-lock', entering);
  const btn = el.querySelector('.fs-btn');
  if (btn){
    btn.innerHTML = entering ? '✕' : '⛶';
    btn.title = entering ? 'ปิดโหมดเต็มจอ' : 'ขยายเต็มจอ';
  }
  if (entering) el.scrollTop = 0;
  Object.values(charts).forEach(c => { if (c && c.resize) c.resize(); });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    const openSection = document.querySelector('.dash-section.is-fullscreen');
    if (openSection) toggleFullscreen(openSection.id);
  }
});

document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);
  if (isTyping) return;
  if (e.key === '/'){
    const filterInput = document.getElementById('trackFilter');
    if (filterInput){ e.preventDefault(); filterInput.focus(); filterInput.select(); }
  } else if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey && !e.altKey){
    const refreshBtn = document.getElementById('btnRefresh');
    if (refreshBtn){ e.preventDefault(); resetRefreshBar(); loadData(false); }
  }
});

function durationLabel(ms){
  const totalMin = Math.floor(ms / 60000);
  const d = Math.floor(totalMin / 1440), h = Math.floor((totalMin % 1440) / 60), m = totalMin % 60;
  const parts = [];
  if (d > 0) parts.push(d + 'd');
  if (h > 0) parts.push(h + 'h');
  parts.push(m + 'm');
  if (d === 0 && h === 0 && m === 0){
    const s = Math.floor((ms % 60000) / 1000);
    parts.push(s + 's');
  }
  return parts.join(' ');
}
function durationBadgeHtml(durationMs, createdMs){
  if (durationMs == null){
    return '<span class="badge" style="background:var(--border-soft);color:var(--text-dim)">-</span>';
  }
  const bg = durationMs < 600000 ? 'rgba(74,222,128,.18)' : durationMs < 1800000 ? 'rgba(251,146,60,.18)' : 'rgba(248,113,113,.18)';
  const fg = durationMs < 600000 ? '#4ADE80' : durationMs < 1800000 ? '#FB923C' : '#F87171';
  const startLabel = createdMs != null ? new Date(createdMs).toLocaleString('th-TH') : '-';
  const totalSec = Math.floor(durationMs / 1000);
  const fullLabel = `${Math.floor(totalSec/3600)}h ${Math.floor((totalSec%3600)/60)}m ${totalSec%60}s`;
  const tip = ['เริ่มสร้าง: ' + startLabel, 'ระยะเวลา: ' + fullLabel].join('\n');
  return `<span class="badge" style="background:${bg};color:${fg}" data-tip="${esc(tip)}">${esc(durationLabel(durationMs))}</span>`;
}

async function buildTrackTooltipHtml(r){
  const secretKey = getSecretKey();
  let piiHtml;
  if (!secretKey){
    piiHtml = `<div class="tt-lock">🔒 Please fill the Secret Key for view customer details.</div>`;
  } else {
    const [first, last, mobile] = await Promise.all([
      decryptCached(r.custFirstName, secretKey),
      decryptCached(r.custLastName, secretKey),
      decryptCached(r.custMobileNo, secretKey)
    ]);
    if ([first, last, mobile].includes('__DECRYPT_FAILED__')){
      piiHtml = `<div class="tt-lock">⚠️ ถอดรหัสไม่สำเร็จ — ตรวจสอบว่า Secret Key ตรงกับที่ตั้งไว้ใน Code.gs</div>`;
    } else {
      const fullName = (first + ' ' + last).trim() || '-';
      piiHtml = `<div class="tt-pii">
        <div class="dl">Customer Name</div><div class="dv">${esc(fullName)}</div>
        <div class="dl" style="margin-top:4px;">Mobile No.</div><div class="dv">${esc(mobile || '-')}</div>
      </div>`;
    }
  }

  const imgHtml = !isBlank(r.imageUrl)
    ? `<img class="tt-img" src="${esc(r.imageUrl)}" alt="${esc(r.commercialName || '')}" onerror="this.remove()">`
    : '';

  const fields = [
    ['Timestamp', r.ts ? r.ts.toLocaleString('th-TH') : null],
    ['Pre-Booking No', r.preBookingNo],
    ['User ID', r.userId],
    ['Order State', r.orderState],
    ['Menu', r.menu],
    ['Order Source', locationDisplayName(r.locationSource)],
    ['Service Care', r.serviceCareTitle],
    ['Stock Destination', r.subStockDestination],
    ['Campaign', r.campaignName],
    ['Reserve Location', r.resLocationName],
    ['Reserve Type', r.resType],
    ['Shipping', [r.resShippingType, r.resShippingSLA].filter(x => !isBlank(x)).join(' - ')]
  ];
  const detailHtml = fields.map(([l,v]) => `<div><div class="dl">${esc(l)}</div><div class="dv">${isBlank(v) ? '-' : esc(v)}</div></div>`).join('');

  return `<button type="button" class="tt-close" title="ปิด">&times;</button>
    ${imgHtml}
    <div class="tt-title">${esc(r.commercialName || r.transactionId || '-')}</div>
    ${piiHtml}

function positionHoverTip(box, anchorRect){
  const pad = 6;
  const w = box.offsetWidth || 160, h = box.offsetHeight || 24;
  let x = anchorRect.left + (anchorRect.width - w) / 2;
  let y = anchorRect.top - h - pad;
  if (y < 8) y = anchorRect.bottom + pad;
  if (x < 8) x = 8;
  if (x + w > window.innerWidth - 8) x = window.innerWidth - w - 8;
  box.style.left = Math.round(Math.max(8, x)) + 'px';
  box.style.top = Math.round(y) + 'px';
}

function initHoverTips(){
  const box = document.getElementById('hoverTip');
  if (!box) return;
  let activeEl = null;
  const show = (el) => {
    const text = el.getAttribute('data-tip');
    if (!text) return;
    activeEl = el;
    box.textContent = text;
    box.classList.add('show');
    positionHoverTip(box, el.getBoundingClientRect());
  };
  const hide = () => { activeEl = null; box.classList.remove('show'); };
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el !== activeEl) show(el);
  });
  document.addEventListener('mouseout', (e) => {
    if (!activeEl) return;
    const stillInside = e.relatedTarget && activeEl.contains(e.relatedTarget);
    if (!stillInside) hide();
  });
  document.addEventListener('focusin', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) show(el);
  });
  document.addEventListener('focusout', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) hide();
  });
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
}

function positionTrackTooltip(box, anchorRect){
  const pad = 8;
  const w = box.offsetWidth || 280, h = box.offsetHeight || 160;
  let x = anchorRect.right + pad;
  let y = anchorRect.top;
  if (x + w > window.innerWidth - 8) x = anchorRect.left - w - pad;
  if (x < 8) x = Math.min(Math.max(8, anchorRect.left), Math.max(8, window.innerWidth - w - 8));
  if (y + h > window.innerHeight - 8) y = Math.max(8, window.innerHeight - h - 8);
  box.style.left = Math.round(Math.max(8, x)) + 'px';
  box.style.top = Math.round(Math.max(8, y)) + 'px';
}

async function openTrackTooltip(key, btnEl){
  if (openTrackKey === key){ closeTrackTooltip(); return; }
  const row = (lastMetrics && lastMetrics.trackAll || []).find(r => trackRowKey(r) === key);
  const box = document.getElementById('trackTooltip');
  if (!row || !box) return;
  document.querySelectorAll('.info-btn.open').forEach(b => b.classList.remove('open'));
  if (btnEl) btnEl.classList.add('open');
  openTrackKey = key;
  box.innerHTML = '<div class="tt-lock">กำลังโหลด...</div>';
  box.classList.add('show');
  if (btnEl) positionTrackTooltip(box, btnEl.getBoundingClientRect());
  const html = await buildTrackTooltipHtml(row);
  if (openTrackKey !== key) return;
  box.innerHTML = html;
  if (btnEl) positionTrackTooltip(box, btnEl.getBoundingClientRect());
  const img = box.querySelector('.tt-img');
  if (img && btnEl){
    if (img.complete){
      positionTrackTooltip(box, btnEl.getBoundingClientRect());
    } else {
      const reposition = () => { if (openTrackKey === key) positionTrackTooltip(box, btnEl.getBoundingClientRect()); };
      img.addEventListener('load', reposition, {once:true});
      img.addEventListener('error', reposition, {once:true});
    }
  }
}

async function renderTrackingOrders(){
  if (!lastMetrics) return;
  const slider = document.getElementById('sliderTrack');
  const filterInput = document.getElementById('trackFilter');
  if (!slider) return;
  const sliderMax = Math.max(25, lastMetrics.trackTotal);
  if (parseInt(slider.max, 10) !== sliderMax) slider.max = String(sliderMax);
  const n = parseInt(slider.value, 10);
  document.getElementById('sliderTrackVal').textContent = n;
  document.getElementById('tag-tracktotal').textContent = `${fmtNum(lastMetrics.trackGrandTotal)} orders`;

  const myToken = ++trackRenderToken;
  const secretKey = getSecretKey();
  const q = ((filterInput && filterInput.value) || '').trim().toLowerCase();
  let list = lastMetrics.trackAll;

  if (q){
    if (secretKey){
      await Promise.all(list.map(async r => {
        const [first, last, mobile] = await Promise.all([
          decryptCached(r.custFirstName, secretKey),
          decryptCached(r.custLastName, secretKey),
          decryptCached(r.custMobileNo, secretKey)
        ]);
        r._searchFirst = first === '__DECRYPT_FAILED__' ? '' : first.toLowerCase();
        r._searchLast = last === '__DECRYPT_FAILED__' ? '' : last.toLowerCase();
        r._searchMobile = mobile === '__DECRYPT_FAILED__' ? '' : mobile.toLowerCase();
      }));
      if (myToken !== trackRenderToken) return;
    }

    list = list.filter(r =>
      (r.transactionId||'').toLowerCase().includes(q) ||
      (r.userId||'').toLowerCase().includes(q) ||
      (r.orderType||'').toLowerCase().includes(q) ||
      (r.commercialName||'').toLowerCase().includes(q) ||
      (secretKey && (
        (r._searchFirst||'').includes(q) ||
        (r._searchLast||'').includes(q) ||
        (r._searchMobile||'').includes(q)
      ))
    );
  }
  list = list.slice(0, n);

  if (openTrackKey && !list.some(r => trackRowKey(r) === openTrackKey)) closeTrackTooltip();

  const maskedByKey = {};
  if (secretKey){
    await Promise.all(list.map(async r => {
      const [first, last] = await Promise.all([
        decryptCached(r.custFirstName, secretKey),
        decryptCached(r.custLastName, secretKey)
      ]);
      maskedByKey[trackRowKey(r)] = (first === '__DECRYPT_FAILED__' || last === '__DECRYPT_FAILED__')
        ? '⚠️ ถอดรหัสไม่สำเร็จ'
        : customerNameMasked(first, last);
    }));
  }
  if (myToken !== trackRenderToken) return;

  const rowsHtml = list.map((r,i) => {
    const key = trackRowKey(r);
    const isOpen = openTrackKey === key;
    const tsLabel = r.ts ? r.ts.toLocaleString('th-TH') : '-';
    const custName = secretKey ? (maskedByKey[key] || '-') : '🔒';
    const custAttr = secretKey ? '' : ' class="cust-name-cell" data-tip="🔒 Please fill the Secret Key for view customer details."';
    return `<tr>
      <td class="col-info"><button type="button" class="info-btn${isOpen ? ' open' : ''}" data-track-toggle="${esc(key)}" title="ดูรายละเอียดเพิ่มเติม">i</button></td>
      <td class="col-no">${i+1}</td>
      <td class="col-ts">${esc(tsLabel)}</td>
      <td class="mono">${esc(r.transactionId || '-')}</td>
      <td class="col-prebook">${isBlank(r.preBookingNo) ? '<span class="empty" style="padding:0;">-</span>' : esc(r.preBookingNo)}</td>
      <td class="col-userid mono">${esc(r.userId || '-')}</td>
      <td${custAttr}>${esc(custName)}</td>
      <td>${esc(r.orderType || '-')}</td>
      <td>${statusBadgeHtml(r.state)}</td>
      <td class="col-orderstate">${orderStateBadgeHtml(r.orderState)}</td>
      <td class="col-duration">${durationBadgeHtml(r.durationMs, r.createdMs)}</td>
      <td class="col-commname">${commercialNameCellHtml(r)}</td>
      <td class="col-orderomni">${orderOmniCellHtml(r)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="13" class="empty">ไม่พบข้อมูล</td></tr>`;

  document.getElementById('body-track').innerHTML = rowsHtml;
}

function rankRows(items, count, color, imgMap){
  const shown = items.slice(0, count);
  const max = Math.max(1, ...items.map(i => i.count));
  return shown.map(i => {
    const pct = i.count > 0 ? Math.max(2, i.count/max*100) : 0;
    const img = imgMap && imgMap[i.name];
    const imgAttr = img ? ` data-img="${esc(img)}"` : '';
    const nameCls = img ? 'rank-name has-img' : 'rank-name';
    return `<div class="rank-row"${imgAttr}>
      <div class="rank-main">
        <div class="${nameCls}" data-tip="${esc(i.name)}">${esc(i.name)}</div>
        <div class="rank-bar-track" aria-hidden="true">
          <div class="rank-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      </div>
      <div class="rank-count">${fmtNum(i.count)}</div>
    </div>`;
  }).join('') || '<div class="empty">ไม่มีข้อมูล</div>';
}

function chartFallback(canvasEl, msg){

  const div = document.createElement('div');

  canvasEl.replaceWith(div);

function updateCompareChart(M){
  const card = document.getElementById('compareCard');
  const heroRow = document.getElementById('heroRow');
  if (!card) return;

  const dayCounts = computeDayCounts(allOrderRows);
  const thisYearDayKeys = Object.keys(dayCounts).sort();
  if (typeof Chart === 'undefined' || !compareData.length || !thisYearDayKeys.length){
    card.style.display = 'none';
    if (heroRow) heroRow.classList.add('no-compare');
    return;
  }
  card.style.display = '';
  if (heroRow) heroRow.classList.remove('no-compare');

  const [ty, tm, td] = thisYearDayKeys[0].split('-').map(Number);
  const thisYearStart = new Date(ty, tm - 1, td);

  const pad = n => String(n).padStart(2,'0');
  const fmtDate = d => pad(d.getDate()) + '/' + pad(d.getMonth()+1);
  const labels = [];
  const thisYearData = [];
  const lastYearData = [];
  const thisYearDates = [];
  const lastYearDates = [];
  compareData.forEach((c, i) => {
    const tyDate = new Date(thisYearStart.getFullYear(), thisYearStart.getMonth(), thisYearStart.getDate() + i);
    thisYearData.push(dayCounts[dayKey(tyDate)] || 0);
    lastYearData.push(c.count);
    thisYearDates.push(fmtDate(tyDate));
    lastYearDates.push(fmtDate(c.date));
    labels.push(`Day ${i + 1}`);
  });

  const thisYearTotal = thisYearData.reduce((a,b) => a+b, 0);
  const lastYearTotal = lastYearData.reduce((a,b) => a+b, 0);
  const tagEl = document.getElementById('tag-comparetotal');
  if (tagEl) tagEl.textContent = `${fmtNum(thisYearTotal)} vs ${fmtNum(lastYearTotal)}`;

  compareChartState.labels = labels;
  compareChartState.thisYearData = thisYearData;
  compareChartState.lastYearData = lastYearData;
  compareChartState.thisYearDates = thisYearDates;
  compareChartState.lastYearDates = lastYearDates;

  const ctx = document.getElementById('chartCompare');
  if (!ctx) return;
  if (!charts.compare){
    charts.compare = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [
        {label:'ปีนี้', data: thisYearData, backgroundColor:'#22B8CF', borderRadius:3, maxBarThickness:28},
        {label:'ปีที่แล้ว', data: lastYearData, backgroundColor:'#C8FF4D', borderRadius:3, maxBarThickness:28}
      ]},
      options: {
        responsive:true, maintainAspectRatio:false, animation:{duration:450, easing:'easeOutQuart'},
        interaction:{mode:'index', intersect:false},
        onHover: (evt, elements, chart) => { chart.canvas.style.cursor = elements.length ? 'help' : 'default'; },
        scales:{
          x:{grid:{display:false}, ticks:{color:'#6E7877', font:{size:9}}},
          y:{beginAtZero:true, grid:{color:'#232729'}, ticks:{color:'#6E7877', font:{size:9}}}
        },
        plugins:{
          legend:{position:'top', labels:{boxWidth:8, font:{size:9.5}, color:'#98A39A'}},
          tooltip:{
            ...TOOLTIP_STYLE,
            mode:'index', intersect:false,
            callbacks:{
              title: items => {
                const i = items[0].dataIndex;
                const s = compareChartState;
                return `${s.labels[i]} (ปีนี้ ${s.thisYearDates[i]} / ปีที่แล้ว ${s.lastYearDates[i]})`;
              },
              label: c => `${c.dataset.label}: ${fmtNum(c.parsed.y)}`,
              afterBody: items => {
                const i = items[0].dataIndex;
                const s = compareChartState;
                const ty = s.thisYearData[i], ly = s.lastYearData[i];
                const diff = ty - ly;
                const sign = diff > 0 ? '+' : (diff < 0 ? '' : '±');
                const pct = ly ? (diff / ly * 100) : (ty ? 100 : 0);
                return ['', `ผลต่าง: ${sign}${fmtNum(diff)} (${sign}${pct.toFixed(1)}%)`];
              }
            }
          }
        }
      }
    });
  } else {
    charts.compare.data.labels = labels;
    charts.compare.data.datasets[0].data = thisYearData;
    charts.compare.data.datasets[1].data = lastYearData;
    charts.compare.update();
  }
}

function updateStockChart(M){
  if (typeof Chart === 'undefined'){
    chartFallback(document.getElementById('chartStock'), 'โหลดไลบรารีกราฟไม่สำเร็จ');
    return;
  }
  const ctx = document.getElementById('chartStock');
  if (!ctx) return;
  const labels = M.stockArr.map(s => s.name);
  const data = M.stockArr.map(s => s.count);

    charts.stock = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: '#1B1F1F', borderWidth: 2 }] },

        responsive:true, maintainAspectRatio:false, cutout:'66%',
        animation:{duration:450, easing:'easeOutQuart'},
        onHover: (evt, elements, chart) => { chart.canvas.style.cursor = elements.length ? 'help' : 'default'; },
        plugins:{
          legend:{display:false},
          tooltip:{
            ...TOOLTIP_STYLE,
            callbacks:{ label: c => {

              const pct = item ? item.pct : 0;

function syncSummaryCardHeights(){
  const volumeCard = document.getElementById('cardVolume');
  const omniCard = document.getElementById('cardOmni');
  const sourceCard = document.getElementById('cardOrderSource');
  if (!volumeCard || !omniCard || !sourceCard) return;
  omniCard.style.minHeight = '';
  sourceCard.style.minHeight = '';
  if (window.innerWidth < 900) return;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const refHeight = volumeCard.offsetHeight;
      if (!refHeight) return;
      omniCard.style.minHeight = refHeight + 'px';
      requestAnimationFrame(() => {
        const gap = 12;
        sourceCard.style.minHeight = (refHeight + gap + omniCard.offsetHeight) + 'px';
      });
    });
  });
}

function showImgPreview(url){
  const box = document.getElementById('imgPreview');
  const img = document.getElementById('imgPreviewImg');
  if (!box || !img || !url) return;
  img.src = url;
  box.style.display = 'block';
}
function positionImgPreview(evt){
  const box = document.getElementById('imgPreview');
  if (!box || box.style.display !== 'block') return;
  const pad = 14, boxW = 144, boxH = 144;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + boxW > window.innerWidth) x = evt.clientX - boxW - pad;
  if (y + boxH > window.innerHeight) y = evt.clientY - boxH - pad;
  box.style.left = Math.max(4, x) + 'px';
  box.style.top = Math.max(4, y) + 'px';
}
function hideImgPreview(){
  const box = document.getElementById('imgPreview');
  if (box) box.style.display = 'none';
}
function bindImgPreviewEvents(){
  document.addEventListener('mouseover', e => {
    const row = e.target.closest && e.target.closest('.rank-row[data-img]');
    if (row) showImgPreview(row.dataset.img);
  });
  document.addEventListener('mousemove', positionImgPreview);
  document.addEventListener('mouseout', e => {
    const row = e.target.closest && e.target.closest('.rank-row[data-img]');
    if (row && (!e.relatedTarget || !row.contains(e.relatedTarget))) hideImgPreview();
  });
}

function setStatus(mode, text){
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (mode === 'error' ? ' err' : mode === 'loading' ? ' loading' : ' ok');
  document.getElementById('statusText').textContent = text;
  const refreshBtn = document.getElementById('btnRefresh');
  if (refreshBtn) refreshBtn.classList.toggle('is-loading', mode === 'loading');
}
function showBanner(msg){
  const b = document.getElementById('banner');
  b.innerHTML = msg;
  b.classList.add('show');
}
function hideBanner(){ document.getElementById('banner').classList.remove('show'); }

function resetRefreshBar(){
  const bar = document.getElementById('refreshBar');
  if (!bar) return;
  bar.style.transition = 'none';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.style.transition = `width ${AUTO_REFRESH_MS}ms linear`;
  bar.style.width = '100%';
}
function startAutoRefresh(){
  if (refreshTimer) clearInterval(refreshTimer);
  resetRefreshBar();
  refreshTimer = setInterval(() => { resetRefreshBar(); loadData(true); }, AUTO_REFRESH_MS);
}

async function loadData(isAuto){
  const cfg = getConfig();
  if (!cfg.sheetId){
    document.getElementById('configPanel').classList.add('open');
    setStatus('error', 'ยังไม่ได้ตั้งค่า Sheet ID');
    return;
  }
  if (isLoading) return;
  isLoading = true;
  if (!isAuto) setStatus('loading', 'กำลังโหลดข้อมูล...');
  try {
    await loadLocationMasterIfNeeded(cfg.sheetId, !isAuto);
    await loadCompareDataIfNeeded(cfg.sheetId, true);
    const {cols, rows} = await fetchSheet(cfg.sheetId, cfg.sheetName);
    allOrderRows = buildRows(cols, rows);
    const parsed = filterToLatestDate(allOrderRows);
    updateDashboard(parsed);
    hideBanner();
    setStatus('ok', 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH'));
  } catch(err){
    console.error(err);
    setStatus('error', 'โหลดข้อมูลไม่สำเร็จ');
    if (!isAuto || !dashboardBuilt) showBanner('<strong>โหลดข้อมูลไม่สำเร็จ:</strong> ' + err.message);
  } finally {
    isLoading = false;
  }
}

(function init(){
  const cfg = getConfig();
  document.getElementById('inputSheetId').value = cfg.sheetId;
  document.getElementById('inputSheetName').value = cfg.sheetName;
  document.getElementById('inputSecretKey').value = cfg.secretKey;
  bindImgPreviewEvents();

  const applySecretKey = () => {
    const secretKey = document.getElementById('inputSecretKey').value.trim();
    saveSecretKey(secretKey);
    clearDecryptCache();
    closeTrackTooltip();
    renderTrackingOrders();
  };
  document.getElementById('btnApplyKey').addEventListener('click', applySecretKey);
  document.getElementById('inputSecretKey').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') applySecretKey();
  });

  document.getElementById('dashTitle').addEventListener('dblclick', () => {
    document.getElementById('configPanel').classList.toggle('open');
  });
  document.getElementById('btnConfig').addEventListener('click', () => {
    document.getElementById('configPanel').classList.toggle('open');
  });
  document.getElementById('btnRefresh').addEventListener('click', () => { resetRefreshBar(); loadData(false); });

  const bindRankSliders = () => {
    const sliderDevice = document.getElementById('sliderDevice');
    const sliderCampaign = document.getElementById('sliderCampaign');
    const sliderTrack = document.getElementById('sliderTrack');
    const sliderSlowest = document.getElementById('sliderSlowest');
    const trackFilter = document.getElementById('trackFilter');
    if (sliderDevice && !sliderDevice.dataset.bound) {
      sliderDevice.addEventListener('input', renderDeviceAccessory);
      sliderDevice.dataset.bound = '1';
    }
    if (sliderCampaign && !sliderCampaign.dataset.bound) {
      sliderCampaign.addEventListener('input', renderCampaignService);
      sliderCampaign.dataset.bound = '1';
    }
    if (sliderTrack && !sliderTrack.dataset.bound) {
      sliderTrack.addEventListener('input', renderTrackingOrders);
      sliderTrack.dataset.bound = '1';
    }
    if (sliderSlowest && !sliderSlowest.dataset.bound) {
      sliderSlowest.addEventListener('input', renderSlowest);
      sliderSlowest.dataset.bound = '1';
    }
    if (trackFilter && !trackFilter.dataset.bound) {
      trackFilter.addEventListener('input', renderTrackingOrders);
      trackFilter.dataset.bound = '1';
    }
  };

  document.addEventListener('click', (e) => {
    const closeBtn = e.target.closest && e.target.closest('.tt-close');
    if (closeBtn){ closeTrackTooltip(); return; }
    const btn = e.target.closest && e.target.closest('[data-track-toggle]');
    if (btn){ openTrackTooltip(btn.getAttribute('data-track-toggle'), btn); return; }
    if (openTrackKey && !(e.target.closest && e.target.closest('#trackTooltip'))) closeTrackTooltip();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTrackTooltip(); });
  window.addEventListener('scroll', () => { if (openTrackKey) closeTrackTooltip(); }, true);
  window.addEventListener('resize', () => { if (openTrackKey) closeTrackTooltip(); });

  let cardHeightResizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(cardHeightResizeTimer);
    cardHeightResizeTimer = setTimeout(syncSummaryCardHeights, 120);
  });

  initHoverTips();
  initOmniShipHover();

  document.getElementById('btnLoad').addEventListener('click', () => {
    const sheetId = document.getElementById('inputSheetId').value.trim();
    const sheetName = document.getElementById('inputSheetName').value.trim() || 'Order';
    const secretKey = document.getElementById('inputSecretKey').value.trim();
    if (!sheetId) { showBanner('กรุณากรอก Google Sheet ID'); return; }
    saveConfig({sheetId, sheetName});
    saveSecretKey(secretKey);
    document.getElementById('configPanel').classList.remove('open');
    loadData(false);
    startAutoRefresh();
  });

  if (cfg.sheetId) { loadData(false); startAutoRefresh(); }
  else document.getElementById('configPanel').classList.add('open');

  const sliderBinderTimer = setInterval(() => {
    const sliderDevice = document.getElementById('sliderDevice');
    const sliderCampaign = document.getElementById('sliderCampaign');
    const sliderTrack = document.getElementById('sliderTrack');
    const sliderSlowest = document.getElementById('sliderSlowest');
    const trackFilter = document.getElementById('trackFilter');
    if (sliderDevice || sliderCampaign || sliderTrack || sliderSlowest || trackFilter) {
      bindRankSliders();
      if (sliderDevice?.dataset.bound && sliderCampaign?.dataset.bound && sliderTrack?.dataset.bound && sliderSlowest?.dataset.bound && trackFilter?.dataset.bound) {
        clearInterval(sliderBinderTimer);
      }
    }
  }, 50);
})();

document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('keydown', (e) => {
  const key = (e.key || '').toUpperCase();
  const ctrlOrCmd = e.ctrlKey || e.metaKey;

  if (e.key === 'F12') { e.preventDefault(); return; }
  if (ctrlOrCmd && e.shiftKey && (key === 'I' || key === 'J' || key === 'C')) { e.preventDefault(); return; }
  if (ctrlOrCmd && key === 'U') { e.preventDefault(); return; }
  if (ctrlOrCmd && key === 'S') { e.preventDefault(); return; }
  if (ctrlOrCmd && key === 'ี') { e.preventDefault(); return; }
  if (ctrlOrCmd && key === 'ห') { e.preventDefault(); return; }
});

</script>
</body>
</html>
